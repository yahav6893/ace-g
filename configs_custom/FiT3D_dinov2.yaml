sst:
  output_dir: ~/dace/outputs
  num_iterations: 25000
  train_head: true

  # Single SCR head trained on FiT3D 3D-aware features.
  # dim_in is auto-set from encoder.dim_out at build time (train_single_scene.py), so it is
  # left unset here and works for any FiT3D model size (S=384, B=768).
  head:
    obj_type: ace_g.scr_heads.MLPHead
    num_blocks: 1
    use_homogeneous: true
    homogeneous_min_scale: 0.01
    homogeneous_max_scale: 4.0
    use_uncertainty: false

  encoder:
    obj_type: ace_g.encoders.FiT3DEncoder
    kwargs:
      # FiT3D model zoo (VERIFY against the FiT3D repo before first run):
      #   dinov2_small_fine (384) | dinov2_reg_small_fine (384)
      #   dinov2_base_fine (768)  | dinov2_reg_base_fine (768)
      model_name: dinov2_base_fine
      repo: ywyue/FiT3D
      # repo_dir: ~/dace/FiT3D       # set to a local clone to avoid GitHub access
      # checkpoint: /path/to/fit3d_weights.pth   # optional weight override
    path: null

  max_buffer_size: 4_000_000
  schedule_config:
    learning_rate_min: 5.0e-05
    learning_rate_max: 0.0005
    learning_rate_div_factor: 25
    learning_rate_final_div_factor: 10000
  use_feature_aug: true
  feature_aug_drop: 0.1
  feature_aug_std: 0.0
  use_half: true
_note: 'Single-expert FiT3D baseline. Trains a plain SCR head on FiT3D (3D-aware DINOv2) features
  to (1) verify FiT3D end-to-end and (2) produce a head.pt usable as a low-depth-bias second
  expert for MoGU fusion. dim_in auto-derives from encoder.dim_out.'
