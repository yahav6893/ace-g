sst:
  output_dir: ~/dace/outputs
  num_iterations: 25000
  train_head: true

  # Single SCR head on MASt3R encoder features (metric, 3D-grounded; low depth bias).
  # dim_in auto-derives from encoder.dim_out.
  head:
    obj_type: ace_g.scr_heads.MLPHead
    num_blocks: 1
    use_homogeneous: true
    homogeneous_min_scale: 0.01
    homogeneous_max_scale: 4.0
    use_uncertainty: false

  encoder:
    obj_type: ace_g.encoders.MASt3REncoder
    kwargs:
      # REQUIRED: path to a MASt3R checkpoint (and mast3r/dust3r importable on PYTHONPATH).
      # e.g. the official MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric weights.
      checkpoint: ~/dace/cache/mast3r/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth
      patch_size: 16
    path: null

  max_buffer_size: 4_000_000
  schedule_config:
    learning_rate_min: 5.0e-05
    learning_rate_max: 0.0005
    learning_rate_div_factor: 25
    learning_rate_final_div_factor: 10000
  use_feature_aug: true
  feature_aug_drop: 0.1
  feature_aug_std: 0.0
  use_half: true
_note: 'Single-expert MASt3R baseline. Metric/3D-grounded features as a low-depth-bias alternative
  to DPT. Requires mast3r/dust3r installed + checkpoint; verify input normalization (DUSt3R uses
  ImageNet mean/std) and patch size. Produces a head.pt for MoGU fusion against DINOv2.'
