sst:
  output_dir: ~/dace/outputs
  num_iterations: 25000
  train_head: true

  # Single SCR head on DINOv2 semantic-segmentation features.
  # dim_in auto-derives from encoder.dim_out (= num_classes if a seg head is provided, else embed_dim).
  head:
    obj_type: ace_g.scr_heads.MLPHead
    num_blocks: 1
    use_homogeneous: true
    homogeneous_min_scale: 0.01
    homogeneous_max_scale: 4.0
    use_uncertainty: false

  encoder:
    obj_type: ace_g.encoders.SemanticDINOv2Encoder
    kwargs:
      model_name: dinov2_vitl14
      num_classes: 150
      # Provide a DINOv2 linear seg-head state_dict (1x1 conv embed_dim->num_classes) to emit class
      # logits; without it the encoder falls back to DINOv2 backbone features (so this config runs).
      # seg_checkpoint: ~/dace/cache/dinov2_seg/ade20k_linear_head.pth
    path: null

  max_buffer_size: 4_000_000
  schedule_config:
    learning_rate_min: 5.0e-05
    learning_rate_max: 0.0005
    learning_rate_div_factor: 25
    learning_rate_final_div_factor: 10000
  use_feature_aug: true
  feature_aug_drop: 0.1
  feature_aug_std: 0.0
  use_half: true
_note: 'Single-expert DINOv2 semantic-segmentation baseline. With a seg head it emits per-patch class
  logits (appearance-based, no depth bias); without one it emits DINOv2 features. Mostly correlated
  with plain DINOv2 - does not add geometry. Produces a head.pt for fusion experiments.'
